# 云端构建 APK：任何 push 到 main（或手动触发）都会在 GitHub 上直接编译出可安装的 APK
#
# 签名说明：
#   - 未配置 secrets 时，使用 Android debug keystore 自动签名（构建永远成功，可安装）。
#   - 想要正式签名，请在仓库 Settings -> Secrets and variables -> Actions 配置：
#       ANDROID_KEYSTORE_B64   = rac-hide.keystore 的 base64 内容（本地执行：
#                                certutil -encode rac-hide.keystore keystore.b64 后取文件内容）
#       ANDROID_KEYSTORE_PASS  = keystore 密码（本地为 rachide2026）
#       ANDROID_KEYSTORE_ALIAS = keystore 别名（本地为 rachide）
#     secrets 只存在于 GitHub 设置里，不进仓库、不对外可见。
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34 + build-tools 34)
        run: |
          set -euxo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/cmdunzip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdunzip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv /tmp/cmdunzip/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Compile, dex, align and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euxo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          BT="$ANDROID_HOME/build-tools/34.0.0"

          rm -rf build && mkdir -p build/gen build/classes build/dex
          # assets 目录兜底：仓库无 assets 时 aapt -A 不会因目录缺失报错
          if [ ! -d android/app/assets ]; then
            mkdir -p android/app/assets
          fi

          # 1) 打包资源并生成 R.java（与本地 build_app.py 同一流程）
          "$AAPT" package -f \
            -M android/app/AndroidManifest.xml \
            -S android/app/res \
            -A android/app/assets \
            -I "$ANDROID_JAR" \
            -F build/app-unsigned.apk \
            -J build/gen

          # 2) javac 编译（UTF-8）
          javac -encoding UTF-8 -classpath "$ANDROID_JAR" -d build/classes \
            $(find build/gen android/app/src -name '*.java')

          # 3) d8 转 dex（min-api 24）
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 24 --output build/dex \
            $(find build/classes -name '*.class')

          # 4) 把 classes.dex 追加进 APK
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app-unsigned.apk', 'a', zipfile.ZIP_DEFLATED) as z:
              z.write('build/dex/classes.dex', 'classes.dex')
          PY

          # 5) zipalign 4 字节对齐
          "$BT/zipalign" -f 4 build/app-unsigned.apk build/app-aligned.apk

          # 6) 版本号取自 AndroidManifest（版本迭代规则：每次发包递增）
          VER=$(sed -n 's/.*versionName="\([^"]*\)".*/\1/p' android/app/AndroidManifest.xml | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"

          # 7) 签名：优先仓库 secrets 正式签名；未配置则 debug keystore 兜底
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > build/keystore.jks
            "$BT/apksigner" sign --ks build/keystore.jks \
              --ks-pass env:KEYSTORE_PASS \
              --ks-key-alias "$KEYSTORE_ALIAS" \
              --out "build/Tuyin-$VER.apk" build/app-aligned.apk
          else
            keytool -genkeypair -v -keystore build/debug.jks \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            "$BT/apksigner" sign --ks build/debug.jks \
              --ks-pass pass:android --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "build/Tuyin-$VER.apk" build/app-aligned.apk
          fi

          # 8) 校验签名
          "$BT/apksigner" verify "build/Tuyin-$VER.apk"
          ls -l "build/Tuyin-$VER.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuyin-${{ env.VER }}-apk
          path: build/Tuyin-${{ env.VER }}.apk
          if-no-files-found: error
